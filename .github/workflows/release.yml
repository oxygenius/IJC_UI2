# Bouwt een release bij het pushen van een tag v<versie>:
#   zip (jar) + Windows-installer, en publiceert ze als GitHub-release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Versie bepalen en controleren tegen de tag
        id: versie
        shell: bash
        run: |
          versie=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "versie=$versie" >> "$GITHUB_OUTPUT"
          if [ "v$versie" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME komt niet overeen met pom.xml-versie $versie"; exit 1
          fi

      - name: Inno Setup installeren (indien nodig)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      # Bouwt Release/ijc_ui-<versie>.zip, target/app-image/IJC_UI2 en Release/IJC_UI2-setup-<versie>.exe
      - name: Bouwen en testen
        run: mvn -B -Prelease,installer package

      # --- Publiceren ---
      - name: GitHub-release maken
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versie=${{ steps.versie.outputs.versie }}
          python .github/scripts/release_notes.py "$versie" > notes.md
          # Kopie met vaste naam voor de directe downloadlink
          # https://github.com/oxygenius/IJC_UI2/releases/latest/download/IJC_UI2-setup.exe
          cp "Release/IJC_UI2-setup-$versie.exe" Release/IJC_UI2-setup.exe
          gh release create "$GITHUB_REF_NAME" \
            "Release/IJC_UI2-setup-$versie.exe" Release/IJC_UI2-setup.exe "Release/ijc_ui-$versie.zip" \
            --title "IJC_UI $versie" --notes-file notes.md --verify-tag --latest
